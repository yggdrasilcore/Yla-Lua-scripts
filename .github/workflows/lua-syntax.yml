name: Lua syntax check

on:
  push:
  pull_request:

jobs:
  luac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luac 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Check Lua syntax with luac -p
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            luac5.1 -p "$f" || failed=1
          done < <(find . -name '*.lua' -print0)
          exit $failed
